# 指標が何を測っているか (runvault の宣言．rs-runvault docs/metrics.ja.md)．
#
# 名前は `simulation/src/record.rs` が書いているものと一致していなければならない．
# ステップごとの指標 (`log_step`) と，試行群をまとめた指標 (`log_condition_summary`)
# の両方をここに置く．
#
# `direction` は «どちらが良いか»．意見の分散やクラスタ数は模型の記述であって成績では
# ないので `none` を書く (欄を書かないこと ＝ «誰も決めていない» と区別するため)．
# 例外は `convergence_rate` で，これは試行がどれだけ使い物になったかの尺度である．

# --- ステップごと (scope=run, step=t) -------------------------------------

[metrics."n_surviving"]
meaning   = "そのステップで生き残っている意見クラスタの数．1 なら合意，2 なら分極，3 以上なら多元"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean"]
meaning   = "全エージェントの意見の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."variance"]
meaning   = "全エージェントの意見の分散．合意へ向かうほど 0 に近づく"
unit      = "ratio"
direction = "none"
scope     = ["run"]

[metrics."n_splits"]
meaning   = "意見の並びを信頼幅 ε で切ったときの切れ目の数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."max_delta"]
meaning   = "1 ステップでの意見の変化量の最大値．収束判定に使う"
unit      = "ratio"
direction = "none"
scope     = ["run"]

# --- 試行 1 本ぶん (scope=run) ---------------------------------------------

[metrics."converged"]
meaning   = "収束して終わったなら 1，打ち切りなら 0"
unit      = "boolean"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."final_iteration"]
meaning   = "停止したときの反復回数"
unit      = "count"
direction = "none"
scope     = ["run"]

# --- 条件ごとの集計 (試行群の平均．scope=run) -------------------------------

[metrics."n_converged"]
meaning   = "この条件の試行のうち収束したものの本数"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."convergence_rate"]
meaning   = "この条件の試行のうち収束したものの割合"
unit      = "ratio"
direction = "up"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_n_surviving"]
meaning   = "試行群にわたる，最終的な意見クラスタ数の平均．ε を広げると 3 以上 → 2 → 1 と動く (本再現の主張)"
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."mean_opinion_mean"]
meaning   = "試行群にわたる最終意見平均の平均"
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."mean_opinion_variance"]
meaning   = "試行群にわたる最終意見分散の平均"
unit      = "ratio"
direction = "none"
scope     = ["run"]

[metrics."mean_final_iteration"]
meaning   = "試行群にわたる，収束までの反復回数の平均"
unit      = "count"
direction = "none"
scope     = ["run"]

# --- 条件（parameters）の説明 -----------------------------------------------
#
# 鍵は JSON ポインタ．`config.json` の `/parameters` からの相対で指す．
# `direction` は持たない —— 条件は評価ではないので «どちらが良いか» が無い．

[parameters."/n"]
meaning = "エージェント数 n"
unit    = "count"

[parameters."/eps_l"]
meaning = "左信頼幅 ε_l．対称 BC モデル（Phase 1 / 2）では ε_r と等しい"
range   = [0.0, 1.0]

[parameters."/eps_r"]
meaning = "右信頼幅 ε_r．非対称信頼（Phase 3）ではここだけが ε_l と違う"
range   = [0.0, 1.0]

[parameters."/symmetric"]
meaning = "ε_l と ε_r が等しいか．対称なら標準経路，違えば非対称版の機構で駆動する"

[parameters."/start_profile"]
meaning = "初期意見の作り方．`uniform` は [0,1] の一様乱数（論文 Fig.3 / 12），`regular` は等間隔 x_i = i/(n−1)（Fig.4〜8）"

[parameters."/max_iterations"]
meaning = "反復の上限 T．ここに達したら収束していなくても止める"
unit    = "count"

[parameters."/tol"]
meaning = "収束判定の許容誤差．max|Δx| がこれを下回ったら止める"

[parameters."/runs"]
meaning = "この条件で走らせる独立試行の本数"
unit    = "count"

[parameters."/seed"]
meaning = "試行のシードを派生させる基準の乱数種"

# --- sweep 親のグリッド定義 --------------------------------------------------

[parameters."/eps_min"]
meaning = "sweep が振る ε の下端"

[parameters."/eps_max"]
meaning = "sweep が振る ε の上端"

[parameters."/eps_step"]
meaning = "ε の刻み幅"
