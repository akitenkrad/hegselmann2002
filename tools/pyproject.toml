[project]
name = "hegselmann-bc-tools"
version = "0.1.0"
description = "Hegselmann & Krause (2002) bounded-confidence opinion dynamics — visualization & analysis tools"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    # run ディレクトリの読み方は runvault が持つ (read 側は pandas を使うので extra)．
    "runvault[read]",
]

[project.scripts]
hegselmann-bc-tools = "hegselmann_bc_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hegselmann_bc_tools"]
